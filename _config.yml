title: زکریا فتاحی
description: اینجا از تجربه‌هام در طراحی، توسعه و مدیریت نرم‌افزار می‌نویسم. آموزش‌ها، ترجمه‌ی مقاله‌های خوب، و هر چیزی که به درد مهندسی نرم‌افزار بخوره رو هم اینجا می‌ذارم.
url: https://zakariafatahi.ir
baseurl: ""
lang: fa
locale: fa_IR
timezone: Europe/Berlin
author:
